# Deploy Skate ATL to the personal Vercel project "skate-atl".
# - A push to main makes a production deploy.
# - A pull request from this repository makes a preview deploy, and the
#   workflow writes the preview URL in one comment on the pull request.
# - After each deploy, the smoke job runs e2e-smoke/ against the new URL (#23).
# The workflow needs one repository secret: VERCEL_TOKEN.
name: Deploy to Vercel

on:
  push:
    branches: [main, "epic/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: team_2bdLcLmZqG0ATIBdkFJVdwaO
  VERCEL_PROJECT_ID: prj_4TH4FAB1lwfWPkj7WOH66bofBbZK
  VERCEL_CLI: vercel@58.4.4

jobs:
  deploy:
    # Pull requests from forks do not get the secret. Skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select the Vercel environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull the Vercel project settings
        run: npx --yes ${{ env.VERCEL_CLI }} pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes ${{ env.VERCEL_CLI }} build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes ${{ env.VERCEL_CLI }} deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      # An epic branch gets a stable URL: epic/city-look -> skate-atl-city-look.vercel.app
      - name: Set the stable URL of the epic branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/epic/')
        env:
          BRANCH: ${{ github.ref_name }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(printf '%s' "${BRANCH#epic/}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-*$//')
          alias="skate-atl-${slug}.vercel.app"
          npx --yes "$VERCEL_CLI" alias set "$DEPLOY_URL" "$alias" --token="$VERCEL_TOKEN" --scope=william-hills-projects
          echo "Stable URL: https://$alias" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the preview URL on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const url = process.env.DEPLOY_URL;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Vercel preview** for ${sha}: ${url}\n\n- pbr look: ${url}/?look=pbr\n- toon look: ${url}/?look=toon\n- low quality: ${url}/?quality=low`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find((c) => c.body && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Issue #23: open the deployed build in headless Chromium. The test checks
  # the headers, the Open Graph share card, and that the game draws frames.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # A preview URL can have Vercel Deployment Protection. Then Vercel
      # answers HTTP 401, 403, or a redirect (302 or 307) to its login page.
      # The smoke test cannot open it, and the job writes a note.
      - name: Check that the deploy is public
        id: reach
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL/")
          echo "HTTP $code from $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "200" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif echo "$code" | grep -qE '^(401|403|302|307)$' && [ "${{ github.event_name }}" != "push" -o "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "The preview is protected. The smoke test did not run." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The deploy answered HTTP $code"
            exit 1
          fi

      - name: Install the dependencies
        if: steps.reach.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.reach.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run the smoke test
        if: steps.reach.outputs.run == 'true'
        env:
          SMOKE_URL: ${{ needs.deploy.outputs.url }}
        run: npx playwright test -c playwright.smoke.config.js

      - name: Keep the screenshots
        if: always() && steps.reach.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-shots
          path: e2e-smoke/.output/
          retention-days: 14
